# .github/workflows/deploy.yml
# --------------------------------
# CI/CD Pipeline using GitHub Actions
#
# Beginner Concept: CI/CD = Continuous Integration / Continuous Deployment
# Every time you push code to GitHub, this pipeline automatically:
#   1. Checks your code for errors (lint)
#   2. Runs tests
#   3. Deploys Lambda functions to AWS
#
# You need to add these GitHub Secrets in your repo settings:
#   AWS_ACCESS_KEY_ID     → your AWS access key
#   AWS_SECRET_ACCESS_KEY → your AWS secret key

name: Deploy AWS Lambda Functions

# When does this pipeline run?
on:
  push:
    branches:
      - main          # Runs when you push to the main branch
    paths:
      - 'lambda/**'   # Only runs if files inside /lambda/ changed

jobs:

  # ── Job 1: Check code quality ──────────────────────────────
  lint:
    name: 🔍 Lint Python Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: pip install flake8

      - name: Run lint check
        run: |
          # Check for syntax errors and basic style issues
          flake8 lambda/ --max-line-length=120 --ignore=E501
          echo "✅ Code looks clean!"

  # ── Job 2: Deploy Lambda to AWS ────────────────────────────
  deploy:
    name: 🚀 Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: lint       # Only runs if lint job passed
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-south-1

      - name: Package and deploy CustomerLookup Lambda
        run: |
          cd lambda
          zip customer_lookup.zip customer_lookup.py
          aws lambda update-function-code \
            --function-name CustomerLookup \
            --zip-file fileb://customer_lookup.zip
          echo "✅ CustomerLookup deployed!"

      - name: Package and deploy CallLogger Lambda
        run: |
          cd lambda
          zip call_logger.zip call_logger.py
          aws lambda update-function-code \
            --function-name CallLogger \
            --zip-file fileb://call_logger.zip
          echo "✅ CallLogger deployed!"

      - name: Deployment complete
        run: echo "🎉 All Lambda functions deployed successfully!"
